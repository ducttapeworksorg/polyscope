name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Bundling Monaco peaks near the ~2 GB heap Node defaults to on the smaller runners private repos get.
      - run: npm run build

      - run: npm test

      # Ubuntu 24.04 blocks the unprivileged user namespaces Chromium's sandbox needs.
      - name: Allow Electron sandbox (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # Xvfb alone has no window manager, so nothing would maximize the window; Fluxbox does.
      - name: Install a window manager (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fluxbox x11-utils

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum sh -c '
            fluxbox > /dev/null 2>&1 &
            for _ in $(seq 1 30); do xprop -root _NET_SUPPORTING_WM_CHECK 2> /dev/null | grep -q "window id" && break; sleep 1; done
            npm run test:smoke'

      - name: Smoke test
        if: runner.os != 'Linux'
        run: npm run test:smoke

      # The Extension Copy in real VS Code, downloaded into .vscode-test.
      - name: VS Code integration test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:extension

      - name: VS Code integration test
        if: runner.os != 'Linux'
        run: npm run test:extension

      # The Extension Copy's .vsix, as the release workflow packages it, so packaging breakage shows before a release.
      - name: Package the Extension Copy (Linux)
        if: runner.os == 'Linux'
        run: npm run extension:vsix

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: polyscope-vsix
          path: extension/*.vsix
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.os }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  # Source Types against real backends: S3 against RustFS, an S3-compatible store with ready-built releases.
  integration:
    name: integration (S3)
    runs-on: ubuntu-latest
    env:
      RUSTFS_VERSION: 1.0.1
      # Pinned, so a release replaced upstream fails the build instead of running unseen.
      RUSTFS_SHA256: a834096dafa1f1a55825a2cdaf49d006a193978d344f2d508c2be475133738a3
      POLYSCOPE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      POLYSCOPE_TEST_S3_ACCESS_KEY: polyscope
      POLYSCOPE_TEST_S3_SECRET_KEY: polyscope-secret
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Start RustFS
        run: |
          archive="rustfs-linux-x86_64-musl-v$RUSTFS_VERSION.zip"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/rustfs/rustfs/releases/download/$RUSTFS_VERSION/$archive"
          echo "$RUSTFS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/$archive" rustfs -d "$RUNNER_TEMP/rustfs"
          mkdir -p "$RUNNER_TEMP/rustfs-data"
          nohup "$RUNNER_TEMP/rustfs/rustfs" server --address 127.0.0.1:9000 \
            --access-key "$POLYSCOPE_TEST_S3_ACCESS_KEY" --secret-key "$POLYSCOPE_TEST_S3_SECRET_KEY" \
            "$RUNNER_TEMP/rustfs-data" > "$RUNNER_TEMP/rustfs.log" 2>&1 &
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:9000/health > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/rustfs.log"
          exit 1

      - run: npm ci

      # The rest of the suite already runs in the build job; only the S3 tests need the store.
      - run: npx vitest run src/main/core/s3

      # The Extension Copy's S3 tests, which the build job skips without a store.
      - name: VS Code integration test
        run: xvfb-run --auto-servernum npm run test:extension

  # Azure Blob Storage against Azurite, Microsoft's emulator, signed into with its well-known development account, and
  # with tokens a stand-in managed identity issues: Azurite takes those over https only, so it serves https with a
  # certificate made here.
  integration-azure:
    name: integration (Azure Blob Storage)
    runs-on: ubuntu-latest
    env:
      # Pinned by digest, so an image replaced upstream fails the build instead of running unseen.
      AZURITE_IMAGE: mcr.microsoft.com/azure-storage/azurite:3.37.0@sha256:830430c1da1a2d537e08f3e6764dd1f5ae00cf0346bcaf625b968ec3f0971fd5
      # Azurite's published development account and key, not a secret.
      POLYSCOPE_TEST_AZURE_CONNECTION_STRING: DefaultEndpointsProtocol=https;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=https://127.0.0.1:10000/devstoreaccount1;
      POLYSCOPE_TEST_AZURE_OAUTH: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # --skipApiVersionCheck: the SDK may ask for a newer API version than this Azurite knows, for calls it supports.
      # --oauth basic: tokens are checked for their audience, issuer and lifetime, not their signature.
      - name: Start Azurite
        run: |
          dir="$RUNNER_TEMP/azurite"
          mkdir -p "$dir"
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$dir/key.pem" -out "$dir/cert.pem" -days 1 \
            -subj /CN=127.0.0.1 -addext subjectAltName=IP:127.0.0.1,DNS:localhost
          # Read by Azurite in its container, which runs as another user; it's thrown away with the runner.
          chmod 644 "$dir/key.pem"
          # Trusted by the tests, as a company's own CA would be.
          echo "NODE_EXTRA_CA_CERTS=$dir/cert.pem" >> "$GITHUB_ENV"
          docker run -d --name azurite -p 127.0.0.1:10000:10000 -v "$dir:/certs:ro" "$AZURITE_IMAGE" \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --oauth basic --cert /certs/cert.pem --key /certs/key.pem
          for _ in $(seq 1 60); do curl -s -o /dev/null --cacert "$dir/cert.pem" https://127.0.0.1:10000/ && exit 0; sleep 1; done
          docker logs azurite
          exit 1

      - run: npm ci

      # The File Source contract suite and the core façade tests; the build job skips them without Azurite.
      - run: npx vitest run src/main/core/azure-blob

      # The Extension Copy's Azure Blob Storage tests, which the build job skips without Azurite.
      - name: VS Code integration test
        run: xvfb-run --auto-servernum npm run test:extension

      - name: Show the Azurite log
        if: failure()
        run: docker logs azurite

  # SSH Files against a real OpenSSH sshd, as well as the in-process server the build job tests against. It runs as the
  # runner's own user on an unprivileged port, with keys generated by tests/ssh/sshd.sh, so none are ever committed.
  integration-ssh:
    name: integration (SSH)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Start sshd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          tests/ssh/sshd.sh >> "$GITHUB_ENV"

      - run: npm ci

      # The File Source contract suite and the core façade tests, against sshd as well as the in-process server.
      - run: npx vitest run src/main/core/ssh

      - name: Show the sshd log
        if: failure()
        run: cat "$RUNNER_TEMP/sshd/sshd.log"

  # Kubernetes Logs and Files against a kind cluster, seeded with the Workloads the tests expect (tests/kind/seed.yaml).
  integration-kubernetes:
    name: integration (Kubernetes)
    runs-on: ubuntu-latest
    env:
      POLYSCOPE_TEST_KUBE_CONTEXT: kind-polyscope
      POLYSCOPE_TEST_KUBE_RESTRICTED_CONTEXT: kind-polyscope-restricted
      POLYSCOPE_TEST_KUBE_NAMESPACE: polyscope-test
      POLYSCOPE_TEST_KUBE_FILES_NAMESPACE: polyscope-files
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: helm/kind-action@v1
        with:
          cluster_name: polyscope

      - name: Seed the cluster
        run: |
          # A bare pod isn't retried like a Workload's: its namespace's default ServiceAccount has to be there first.
          kubectl create namespace polyscope-test
          kubectl -n polyscope-test wait --for=create serviceaccount/default --timeout=60s
          kubectl apply -f tests/kind/seed.yaml
          # The CronJob never comes due by itself; one run gives it a Job.
          kubectl -n polyscope-test create job nightly-manual --from=cronjob/nightly
          kubectl -n polyscope-test rollout status deployment/web --timeout=180s
          kubectl -n polyscope-test rollout status statefulset/db --timeout=180s
          kubectl -n polyscope-test rollout status daemonset/agent --timeout=180s
          kubectl -n polyscope-test wait --for=condition=complete job/migrate job/nightly-manual --timeout=180s
          kubectl -n polyscope-test wait --for=condition=Ready pod/counter --timeout=180s
          kubectl -n polyscope-files rollout status deployment/files-busybox --timeout=180s
          kubectl -n polyscope-files rollout status statefulset/files-coreutils --timeout=180s
          kubectl -n polyscope-files rollout status deployment/files-shellless --timeout=180s
          kubectl -n polyscope-files rollout status deployment/files-pair --timeout=180s
          kubectl -n polyscope-files rollout status deployment/files-rollout --timeout=180s
          # A context signed in as the seed's restricted ServiceAccount, for the permission errors.
          kubectl config set-credentials polyscope-restricted --token="$(kubectl -n polyscope-test create token restricted --duration=2h)"
          kubectl config set-context "$POLYSCOPE_TEST_KUBE_RESTRICTED_CONTEXT" --cluster=kind-polyscope --user=polyscope-restricted

      - run: npm ci

      - run: npx vitest run src/main/core/kubernetes

      # The Extension Copy's Kubernetes tests, which the build job skips without a cluster.
      - name: VS Code integration test
        run: xvfb-run --auto-servernum npm run test:extension

      - name: Show the seeded namespace
        if: failure()
        run: |
          kubectl -n polyscope-test get all -o wide
          kubectl -n polyscope-files get all -o wide

  # systemd Journal against the runner's own journal, seeded with transient units started with systemd-run
  # (tests/journal/seed.sh), read on this machine and as a host over SSH, through an OpenSSH sshd on localhost
  # (tests/ssh/sshd.sh); the runner's user may read the system journal, and sudo for the restart test.
  integration-journal:
    name: integration (systemd Journal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # It prints POLYSCOPE_TEST_JOURNAL_COUNTER=…, the counter unit the tests read.
      - name: Seed the journal
        run: tests/journal/seed.sh >> "$GITHUB_ENV"

      - name: Start sshd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          tests/ssh/sshd.sh >> "$GITHUB_ENV"

      - run: npm ci

      # The Log Source contract suite and the core façade tests, against the journal on this machine and over sshd, as
      # well as stand-in commands and the in-process SSH server.
      - run: npx vitest run src/main/core/journal src/main/core/systemd-journal

      - name: Show the seeded units
        if: failure()
        run: systemctl list-units --all --no-pager 'polyscope-*'

      - name: Show the sshd log
        if: failure()
        run: cat "$RUNNER_TEMP/sshd/sshd.log"

  # Docker Logs against the runner's own Docker Engine, as well as the in-process stand-in the build job tests against,
  # seeded with a Compose project and standalone containers (tests/docker/seed.sh), through a Docker context that
  # fronts it with TLS asking for a client certificate (tests/docker/tls.sh), and through an ssh:// one reaching it over
  # an OpenSSH sshd on localhost (tests/docker/ssh.sh).
  integration-docker:
    name: integration (Docker)
    runs-on: ubuntu-latest
    env:
      POLYSCOPE_TEST_DOCKER: seeded
      POLYSCOPE_TEST_DOCKER_TLS_CONTEXT: polyscope-test-tls
      POLYSCOPE_TEST_DOCKER_SSH_CONTEXT: polyscope-test-ssh
      POLYSCOPE_TEST_DOCKER_SSH_DIR: /tmp/polyscope-docker-ssh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Seed the engine
        run: tests/docker/seed.sh

      - name: Front the engine with TLS
        run: tests/docker/tls.sh

      - name: Reach the engine over SSH
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server
          tests/docker/ssh.sh

      - run: npm ci

      # The Log Source contract suite and the core façade tests, against the engine (over its socket, over TLS and over
      # SSH) as well as the stand-in.
      - run: npx vitest run src/main/core/docker

      - name: Show the seeded containers
        if: failure()
        run: docker ps -a

      - name: Show the sshd log
        if: failure()
        run: cat "$POLYSCOPE_TEST_DOCKER_SSH_DIR/sshd.log"
