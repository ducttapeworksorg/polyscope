name: Release

# Pushing a version tag (v1.2.3, matching package.json) builds every platform's installers and the Extension Copy's
# .vsix, and publishes them to GitHub Releases, where the app looks for updates, and the .vsix to Open VSX and, for a
# stable release, the VS Code Marketplace.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  # One draft for every platform to upload to; building them side by side would otherwise race to create it.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches the version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json's version, $version"
            exit 1
          fi

      # A rerun after a failed build finds the draft already there, and uploads to it again.
      - name: Create the draft release
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Polyscope ${GITHUB_REF_NAME#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    name: package (${{ matrix.os }})
    needs: draft
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # electron-builder makes the .rpm with rpmbuild.
      - name: Install rpm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci

      # Bundling Monaco peaks near the ~2 GB heap Node defaults to on the smaller runners private repos get.
      - run: npm run build

      # Uploads the installers, Windows' portable downloads, and the latest*.yml files electron-updater reads, to the draft.
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ github.token }}

  # The Extension Copy, at the app's version: one .vsix for every platform, beside the installers.
  extension:
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run extension:vsix

      # --clobber, so a rerun replaces what an earlier attempt uploaded.
      - name: Attach the .vsix to the draft
        run: gh release upload "$GITHUB_REF_NAME" "extension/polyscope-${GITHUB_REF_NAME#v}.vsix" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [package, extension]
    runs-on: ubuntu-latest
    steps:
      # A tag with a pre-release part (v1.3.0-beta.1) is published as a pre-release, which installed copies skip.
      - name: Publish the release
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) kind=(--prerelease) ;;
            *) kind=(--latest) ;;
          esac
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "${kind[@]}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The released .vsix, on Open VSX, the marketplace of VSCodium, Cursor, Windsurf and others. Only once the release is
  # out, so a failed build can't leave a version there that GitHub doesn't have. A pre-release's .vsix is marked as one,
  # so the editors only offer it to those who switched to pre-release versions.
  open-vsx:
    needs: publish
    runs-on: ubuntu-latest
    # id-token, for the OIDC token Open VSX trusts this workflow by, in place of an access token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the .vsix from the release
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "polyscope-${GITHUB_REF_NAME#v}.vsix"
        env:
          GH_TOKEN: ${{ github.token }}

      # --trusted-publishing, so it fails rather than falls back when there's no ID token. --skip-duplicate, so a rerun
      # after the upload went through doesn't fail on the version being there already.
      - name: Publish to Open VSX
        run: npx --yes ovsx publish "polyscope-${GITHUB_REF_NAME#v}.vsix" --trusted-publishing --skip-duplicate

  # The released .vsix, on the VS Code Marketplace too. Stable releases only: the Marketplace takes no pre-release part
  # in a version (1.3.0-beta.1), so a pre-release goes to GitHub and Open VSX alone.
  vs-marketplace:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    # The environment is what the Entra app's federated credential names, as a tag's ref can't be matched by pattern.
    environment: vs-marketplace
    # id-token, for the OIDC token Entra ID trusts this workflow by, in place of a personal access token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Download the .vsix from the release
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern "polyscope-${GITHUB_REF_NAME#v}.vsix"
        env:
          GH_TOKEN: ${{ github.token }}

      # The app needs no Azure subscription, only to be a member of the publisher.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # --azure-credential, so vsce signs in as the app Azure CLI just logged in as. --skip-duplicate, so a rerun after
      # the upload went through doesn't fail on the version being there already.
      - name: Publish to the VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath "polyscope-${GITHUB_REF_NAME#v}.vsix" --azure-credential --skip-duplicate
