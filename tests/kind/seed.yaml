# What the Kubernetes integration tests expect to find in their test namespaces. CI applies it to a kind
# cluster, then runs the CronJob once (as nightly-manual) so it has a Job; see .github/workflows/ci.yml.
apiVersion: v1
kind: Namespace
metadata:
  name: polyscope-test
---
# One replica, with an init container, a native sidecar (an init container that keeps running) and the app.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: polyscope-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      terminationGracePeriodSeconds: 1
      initContainers:
        - name: setup
          image: busybox:1.36
          command: ['sh', '-c', 'echo setup done']
        - name: proxy
          image: busybox:1.36
          restartPolicy: Always
          command: ['sh', '-c', 'echo proxy up; sleep 3600000']
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c', 'echo web ready; sleep 3600000']
---
# Keeps crashing, so it restarts over and over.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crasher
  namespace: polyscope-test
spec:
  replicas: 1
  selector:
    matchLabels: { app: crasher }
  template:
    metadata:
      labels: { app: crasher }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: crash
          image: busybox:1.36
          command: ['sh', '-c', 'echo crashing; exit 1']
---
# Two containers in one pod.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: polyscope-test
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: { app: db }
  template:
    metadata:
      labels: { app: db }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: db
          image: busybox:1.36
          command: ['sh', '-c', 'echo db ready; sleep 3600000']
        - name: backup
          image: busybox:1.36
          command: ['sh', '-c', 'echo backup idle; sleep 3600000']
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: agent
  namespace: polyscope-test
spec:
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: agent
          image: busybox:1.36
          command: ['sh', '-c', 'echo agent watching; sleep 3600000']
---
# Never due by itself: CI runs it once as nightly-manual.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly
  namespace: polyscope-test
spec:
  schedule: '0 0 1 1 *'
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: report
              image: busybox:1.36
              command: ['sh', '-c', 'echo report done']
---
# A Job of its own, outside any CronJob.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: polyscope-test
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command: ['sh', '-c', 'echo migrated']
---
# No Workload owns it. Prints `line 1` to `line 100`, then waits.
apiVersion: v1
kind: Pod
metadata:
  name: counter
  namespace: polyscope-test
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: counter
      image: busybox:1.36
      command: ['sh', '-c', 'for i in $(seq 1 100); do echo "line $i"; done; sleep 3600000']
---
# For permission errors: the context CI makes for this ServiceAccount may list the namespace's Workloads and
# pods, but not read a StatefulSet by name, nor read any log.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: restricted
  namespace: polyscope-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: restricted
  namespace: polyscope-test
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [list]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: restricted
  namespace: polyscope-test
subjects:
  - kind: ServiceAccount
    name: restricted
    namespace: polyscope-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: restricted
---
# Kubernetes Files: a namespace of its own, so the Logs tests' view of polyscope-test stays as it is. Every pod has
# the same files at /data, written as it starts: app.log, logs/old.log and an empty folder, empty/.
apiVersion: v1
kind: Namespace
metadata:
  name: polyscope-files
---
# busybox's sh and tools.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-busybox
  namespace: polyscope-files
spec:
  replicas: 1
  selector:
    matchLabels: { app: files-busybox }
  template:
    metadata:
      labels: { app: files-busybox }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/logs /data/empty; printf "started\n" > /data/app.log; printf "one\ntwo\n" > /data/logs/old.log; exec sleep 3600000']
---
# Debian's dash and coreutils, in two pods.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: files-coreutils
  namespace: polyscope-files
spec:
  serviceName: files-coreutils
  replicas: 2
  selector:
    matchLabels: { app: files-coreutils }
  template:
    metadata:
      labels: { app: files-coreutils }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: debian:bookworm-slim
          command: ['sh', '-c', 'mkdir -p /data/logs /data/empty; printf "started\n" > /data/app.log; printf "one\ntwo\n" > /data/logs/old.log; exec sleep 3600000']
---
# No shell at all: busybox writes the files into a volume that the shell-less pause container shows at /data.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-shellless
  namespace: polyscope-files
spec:
  replicas: 1
  selector:
    matchLabels: { app: files-shellless }
  template:
    metadata:
      labels: { app: files-shellless }
    spec:
      terminationGracePeriodSeconds: 1
      volumes:
        - name: data
          emptyDir: {}
      initContainers:
        - name: seed
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data/logs /data/empty; printf "started\n" > /data/app.log; printf "one\ntwo\n" > /data/logs/old.log']
          volumeMounts: [{ name: data, mountPath: /data }]
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          volumeMounts: [{ name: data, mountPath: /data }]
---
# Two containers to browse: a native sidecar and the app, each of which writes its name to /data/whoami.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-pair
  namespace: polyscope-files
spec:
  replicas: 1
  selector:
    matchLabels: { app: files-pair }
  template:
    metadata:
      labels: { app: files-pair }
    spec:
      terminationGracePeriodSeconds: 1
      initContainers:
        - name: proxy
          image: busybox:1.36
          restartPolicy: Always
          command: ['sh', '-c', 'mkdir -p /data; echo proxy > /data/whoami; exec sleep 3600000']
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data; echo app > /data/whoami; exec sleep 3600000']
---
# Its pod is deleted by the test of tabs whose pod is gone, so nothing else uses it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: files-rollout
  namespace: polyscope-files
spec:
  replicas: 1
  selector:
    matchLabels: { app: files-rollout }
  template:
    metadata:
      labels: { app: files-rollout }
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: busybox:1.36
          command: ['sh', '-c', 'mkdir -p /data; printf "started\n" > /data/app.log; exec sleep 3600000']
